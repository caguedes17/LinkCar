{% extends 'base.html' %}{% block title %}Criar conta{% endblock %}{% block content %}
<section class="narrow section"><span class="kicker">COMECE POR AQUI</span><h1 class="page-title">Crie sua conta</h1><p class="muted">Em poucos passos você já pode explorar o LinkCar.</p><div class="panel form-panel"><form id="form-cadastro"><div class="field-grid"><label>Nome completo<input required name="nome" minlength="2" autocomplete="name" placeholder="Seu nome"></label><label>E-mail<input required name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com"></label></div><div class="field-grid"><label>Senha<input required name="senha" type="password" minlength="8" autocomplete="new-password" placeholder="Pelo menos 8 caracteres"></label><label>Confirme a senha<input required name="confirmar" type="password" minlength="8" autocomplete="new-password" placeholder="Repita a senha"></label></div><label>Quero usar o LinkCar como<select name="perfil" required><option value="usuario">Usuário — encontrar meu carro</option><option value="anunciante">Anunciante — publicar veículos</option></select></label><button type="submit" class="btn btn-primary full">Criar minha conta</button></form><p class="muted small centered">Já tem conta? <a class="text-link" href="/login">Entrar</a></p></div></section>
{% endblock %}
